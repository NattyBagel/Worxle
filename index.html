<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorXle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
        rel="stylesheet">
</head>

<body id="body">
    <div class="center">
        <space class="titleTop"></space>
        <wordlegrid class="board" id="board"></wordlegrid>
        <space class="title"></space>
        <text>6 Letter Wordle, however... the game lies to you! (v0.95)</text>
        <space class="buttons"></space>
        <buttonRow>
            <button class="daySelect" id="back"></button>
            <button class="gameSelect" id="worxle">Today's Worxle</button>
            <button class="daySelect" id="next" disabled></button>
        </buttonRow>
        <button class="gameSelect" id="infinite">Random Worxle</button>
        <space class="rules"></space>
        <text>Once per guess, theres one square swapped to a different colour then it's supposed to be. You can also
            click the square to the colour you think it is.</text>
        <text>Can you still solve the puzzle?</text>
        <space class="rules"></space>
    </div>
    <script src="index.js"></script>
    <link rel="stylesheet" href="styles.css">
</body>

</html>
